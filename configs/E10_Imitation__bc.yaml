# E10_Imitation — Behavioral Cloning.
#
# Урок: https://rl-cuber-unity-code.com/courses/3-4 (BC и GAIL)
#
# Это единственный конфиг лаборатории, в котором обучение НЕ является
# обучением с подкреплением: ни награды, ни ценности, ни разведки — только
# пары «наблюдение → действие» от эксперта и обычная классификация.
# Среда нужна лишь для того, чтобы измерить результат: точность на парах
# и доля пройденных коридоров — разные величины, и первая систематически
# завышает вторую (сдвиг распределения, Ross & Bagnell, 2010).

experiment:
  env_id: E10_Imitation
  algo: bc
  seeds: [0, 1, 2]
  # У BC «шаг» — это мини-батч, а не шаг среды. Значение мало по сравнению
  # с бюджетами RL-конфигов, и это ровно то, что демонстрирует пример.
  total_steps: 4000
  notes: "Урок 3.4: Behavioral Cloning на демонстрациях скриптового эксперта"

env:
  mode: build
  build_path: builds/E10_Imitation/E10_Imitation.exe
  num_areas: 8
  time_scale: 20.0
  no_graphics: true
  env_parameters:
    difficulty: 1.0

demonstrations:
  # Готовый набор лежит в репозитории (8 КБ): BC на нём запускается без Unity
  # вовсе. Если файла нет, он записывается скриптовым экспертом с билда.
  path: data/demos/E10_Imitation_expert.npz
  # Сколько эпизодов записать, если файла нет. Сто эпизодов = 4800 пар.
  episodes: 100
  expert: corridor
  # Доля, отложенная для проверки. Без неё «BC выучил эксперта» неотличимо
  # от «BC запомнил записи»: точность на обучающих парах у достаточно
  # большой сети доходит до единицы в любом случае.
  holdout: 0.2

network:
  # Вход политики: 13 векторных признаков. Та же архитектура, что у RL-методов:
  # BC часто используют как инициализацию для последующего RL.
  type: mlp
  hidden_sizes: [128, 128]
  activation: relu

algo:
  learning_rate: 0.001
  batch_size: 256
  weight_decay: 0.0
  # Ноль — чистая классификация. Положительный удерживает политику
  # от полной уверенности: при дообучении RL нулевая энтропия означает
  # нулевую разведку.
  entropy_coef: 0.0
  max_grad_norm: 1.0
  # Ключ обязателен схемой конфигов; методом не используется.
  epsilon: 0.0

eval:
  every_steps: 500
  episodes: 30
  deterministic: true
  # Успех определяется исходом эпизода: награда содержит штраф за время
  # и мерой качества не является (T-15).
  success_rule: terminated

success_criteria:
  # Порог высокий, потому что измерение это позволяет: смоук-прогон на 2000
  # мини-батчей дал 100 % пройденных коридоров при 0.0 % у случайной политики.
  # Сдвиг распределения на коридоре без развилок не проявляется — сходить
  # с маршрута эксперта некуда (ENV_SPEC.md, §1).
  metric: Eval/Success Rate
  threshold: 0.9
  within_steps: 4000

export:
  onnx_path: unity/MLAgentsLab/Assets/Envs/E10_Imitation/Models/E10_Imitation_bc.onnx
  verify: true
