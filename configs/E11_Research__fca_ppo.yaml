# E11_Research — PPO со слоем понятий FCA. Исследовательский слот.
#
# Модуль курса: https://rl-cuber-unity-code.com/fca-rl
#
# Гипотеза: задача «взять ключ → дойти до двери → дойти до цели» иерархична,
# и обычная MLP-политика тратит часть бюджета на то, чтобы вывести эту
# иерархию из наград. Решётка формальных понятий, построенная по бинарным
# признакам состояния, даёт готовые составные признаки вида «есть ключ И
# я справа от стены» — то есть ровно те подцели.
#
# Что проверяется: даёт ли слой понятий выигрыш по числу шагов среды
# до порога — и не ломает ли он экспорт в ONNX.
#
# Контрольная точка сравнения — configs/E11_Research__ppo_discrete.yaml:
# та же среда, тот же бюджет, обычная MLP-политика.

experiment:
  env_id: E11_Research
  algo: fca_ppo
  seeds: [0, 1, 2]
  total_steps: 300000
  notes: "Модуль /fca-rl: слой понятий FCA внутри графа политики"

env:
  mode: build
  build_path: builds/E11_Research/E11_Research.exe
  num_areas: 8
  time_scale: 20.0
  no_graphics: true
  env_parameters:
    difficulty: 1.0

fca:
  # Сколько первых признаков наблюдения бинарны и образуют формальный
  # контекст. Порядок задан KeyDoorAgent.CollectObservations и обязан
  # совпадать с labrl.nets.fca.KEYDOOR_ATTRIBUTES.
  num_attributes: 7
  # Сколько шагов собрать случайной политикой, прежде чем строить решётку.
  # Опыт нужен разнообразный, а не хороший: понятия описывают структуру
  # пространства состояний, а не удачные траектории.
  warmup_steps: 2000
  # Минимальная доля состояний в объёме понятия. Отсекает редкие сочетания:
  # признак, встретившийся в трёх состояниях из тысяч, — шум опыта,
  # а не структура задачи.
  min_support: 0.02
  # Ограничение на длину содержания. Понятие из шести признаков почти
  # наверняка описывает частный случай, а не подцель.
  max_intent: 4
  # Крутизна сигмоид бинаризации и принадлежности. При целых 0/1 на входе
  # значение 20 численно неотличимо от жёсткой проверки, но дифференцируемо.
  sharpness: 20.0

network:
  # Вход MLP: 16 признаков наблюдения + число найденных понятий.
  # Второе слагаемое известно только после построения решётки, поэтому
  # в конфиге его нет — размер слоя вычисляется в build_fca_ppo.
  type: mlp
  hidden_sizes: [128, 128]
  activation: relu

algo:
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate:
    type: linear
    start: 0.0003
    end: 0.00005
    decay_steps: 300000
  clip_range: 0.2
  epochs: 4
  minibatch_size: 512
  rollout_steps: 256
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  normalize_advantage: true
  target_kl: 0.0
  epsilon: 0.0

eval:
  # Часто — намеренно. Измеряемая величина этого слота не итоговая доля
  # успехов (она упирается в потолок у обоих методов), а ЧИСЛО ШАГОВ
  # до порога. При оценке раз в 20 000 шагов оба метода показывали 100 %
  # уже на первом замере, и сравнивать было нечего (измерено).
  every_steps: 2500
  episodes: 30
  deterministic: true
  # Успех — по исходу эпизода: награда содержит и премию за ключ,
  # и штраф за время, и мерой качества не является (T-15).
  success_rule: terminated

success_criteria:
  metric: Eval/Success Rate
  threshold: 0.7
  within_steps: 300000

export:
  # Слой понятий уезжает в граф ВМЕСТЕ с политикой: признаки, посчитанные
  # в Python и не попавшие в ONNX, — гарантированное расхождение обучения
  # и инференса (требование 10.7).
  onnx_path: unity/MLAgentsLab/Assets/Envs/E11_Research/Models/E11_Research_fca_ppo.onnx
  verify: true
