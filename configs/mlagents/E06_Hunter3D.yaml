# Эталонный конфиг ШТАТНОГО тренера ML-Agents для E06_Hunter3D (п. 12.5).
#
# Он существует не для того, чтобы им пользовались вместо labrl, а чтобы
# при подозрении на ошибку было с чем сравнить: если штатный тренер учится,
# а наш — нет, дело в нашем коде; если не учится ни один — дело в среде.
#
# Запуск (из корня репозитория, при активированном python/.venv):
#   mlagents-learn configs/mlagents/E06_Hunter3D.yaml \
#     --env=builds/E06_Hunter3D/E06_Hunter3D.exe --run-id=E06_ppo_ref
#
# Ключ behaviors ОБЯЗАН содержать идентификатор среды: иначе тренер
# не подключится к сцене (правило 5.3).

behaviors:
  E06_Hunter3D:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.01          # у нас — entropy_coef
      epsilon: 0.2         # у нас — clip_range
      lambd: 0.95          # у нас — gae_lambda
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 10000
