# Эталонный конфиг ШТАТНОГО тренера ML-Agents (mlagents-learn) — п. 12.5 инструкции.
# Нужен только для сравнения «моя реализация ↔ эталон». Собственные конфиги — в configs/E##_<Name>__<algo>.yaml.
# Запуск: mlagents-learn configs/mlagents/E02_CartPoleUnity.yaml --run-id=<run-id>
#
# Штатный тренер работает с сырым непрерывным наблюдением и никакой сетки
# не строит. Сравнение с нашей реализацией показывает цену дискретизации:
# сколько задача теряет от ручного разбиения пространства на ячейки.
behaviors:
  E02_CartPoleUnity:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 64
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 200000
    time_horizon: 64
    summary_freq: 10000
