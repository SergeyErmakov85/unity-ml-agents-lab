# Эталонный конфиг ШТАТНОГО тренера ML-Agents (mlagents-learn) — п. 12.5 инструкции.
# Нужен только для сравнения «моя реализация ↔ эталон». Собственные конфиги — в configs/E##_<Name>__<algo>.yaml.
# Запуск: mlagents-learn configs/mlagents/E00_Bandit.yaml --run-id=<run-id>
#
# Оговорка. Штатный тренер решает бандита «из пушки по воробьям»: PPO строит
# политику над единственным состоянием, тогда как задача урока 1.7 — сравнить
# правила разведки, а не обучить сеть. Конфиг сохранён как диагностика среды:
# если PPO не находит лучшую руку, значит сломана сама среда.
behaviors:
  E00_Bandit:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 1024
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 32
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 50000
    time_horizon: 1        # эпизод длится один шаг
    summary_freq: 2000
