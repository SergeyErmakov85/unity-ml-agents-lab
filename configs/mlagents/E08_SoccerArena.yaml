# Эталонный конфиг ШТАТНОГО тренера ML-Agents для E08_SoccerArena (п. 12.5).
#
# Он существует не для того, чтобы им пользовались вместо labrl, а чтобы
# при подозрении на ошибку было с чем сравнить: если штатный тренер учится,
# а наш — нет, дело в нашем коде; если не учится ни один — дело в среде.
#
# Запуск (из корня репозитория, при активированном python/.venv):
#   mlagents-learn configs/mlagents/E08_SoccerArena.yaml \
#     --env=builds/E08_SoccerArena/E08_SoccerArena.exe --run-id=E08_poca_ref
#
# Ключ behaviors ОБЯЗАН содержать идентификатор среды: иначе тренер
# не подключится к сцене (правило 5.3). Суффикс ?team= здесь НЕ пишется —
# штатный тренер добавляет его сам.

behaviors:
  E08_SoccerArena:
    # POCA — штатная реализация того же семейства, что наш labrl.algos.mapoca:
    # централизованный критик, децентрализованное исполнение.
    trainer_type: poca

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005          # у нас — entropy_coef
      epsilon: 0.2         # у нас — clip_range
      lambd: 0.95          # у нас — gae_lambda
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    max_steps: 20000000
    time_horizon: 1000
    summary_freq: 10000

    # Самоигра. Наш аналог — блок selfplay конфига E08_SoccerArena__mapoca.yaml
    # и labrl.train.selfplay; соответствие ключей:
    #   save_steps      <-> save_every_steps
    #   swap_steps      <-> swap_every_steps
    #   window          <-> window
    #   play_against_latest_model_ratio <-> play_against_latest_ratio
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
