# Эталонный конфиг ШТАТНОГО тренера ML-Agents (mlagents-learn) — п. 12.5 инструкции.
# Нужен только для сравнения «моя реализация ↔ эталон». Собственные конфиги — в configs/E##_<Name>__<algo>.yaml.
# Запуск: mlagents-learn configs/mlagents/E04_BallBalance.yaml --run-id=<run-id>
#
# Значения близки к эталонному 3DBall из пакета ML-Agents: эта среда —
# его прямой аналог, и сравнение с нашим PPO (configs/E04_BallBalance__ppo.yaml)
# наиболее показательно именно здесь.
behaviors:
  E04_BallBalance:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 12000
      learning_rate: 3.0e-4
      beta: 0.001
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 500000
    time_horizon: 1000
    summary_freq: 12000
