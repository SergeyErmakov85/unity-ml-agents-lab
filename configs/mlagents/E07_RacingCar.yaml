# Эталонный конфиг ШТАТНОГО тренера ML-Agents для E07_RacingCar (п. 12.5).
#
# Он существует не для того, чтобы им пользовались вместо labrl, а чтобы
# при подозрении на ошибку было с чем сравнить: если штатный тренер учится,
# а наш — нет, дело в нашем коде; если не учится ни один — дело в среде.
#
# Запуск (из корня репозитория, при активированном python/.venv):
#   mlagents-learn configs/mlagents/E07_RacingCar.yaml \
#     --env=builds/E07_RacingCar/E07_RacingCar.exe --run-id=E07_sac_ref
#
# Ключ behaviors ОБЯЗАН содержать идентификатор среды: иначе тренер
# не подключится к сцене (правило 5.3).

behaviors:
  E07_RacingCar:
    trainer_type: sac

    hyperparameters:
      batch_size: 256
      buffer_size: 500000
      learning_rate: 0.0003
      tau: 0.005
      init_entcoef: 0.2
      buffer_init_steps: 1000
      steps_per_update: 10.0
      save_replay_buffer: false
      learning_rate_schedule: linear

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 10000
