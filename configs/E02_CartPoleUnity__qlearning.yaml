# Табличный Q-learning с дискретизацией в среде E02_CartPoleUnity (урок 1.5).
#
# Ключевая идея примера: непрерывное наблюдение режется сеткой, и каждая ячейка
# становится состоянием таблицы. Сетка задана здесь и **той же самой** уезжает
# в граф ONNX (labrl.nets.discretized.DiscretizedQTable) — иначе Unity
# истолкует вход иначе, чем обучение (требование 10.7).
#
# Структура блоков — Приложение A инструкции проекта.

experiment:
  env_id: E02_CartPoleUnity
  algo: qlearning
  seeds: [0, 1, 2]
  total_steps: 150000       # шагов сбора; шаг = один env.step() по всем аренам
  notes: "Урок 1.5. Перенос эталонного CartPole-v0 в Unity; мост от таблицы (E01) к DQN (E03)."

env:
  mode: build
  build_path: builds/E02_CartPoleUnity/E02_CartPoleUnity.exe
  num_areas: 8              # 8 арен в сцене = 8 параллельных сред
  time_scale: 20.0
  no_graphics: true
  env_parameters:
    difficulty: 1.0

network:
  # Обучаемой сети нет: политика — матрица Q (576 x 2). «Сеть» появляется
  # только на экспорте и включает в себя саму сетку дискретизации.
  type: discretized
  num_actions: 2
  # Границы области интереса по каждому измерению наблюдения.
  # Сетка разомкнута: значения за границами попадают в крайние ячейки,
  # поэтому покрывать экстремумы не требуется.
  #        x      ẋ      θ         θ̇
  lows:  [-2.4, -3.0, -0.2095, -2.5]
  highs: [ 2.4,  3.0,  0.2095,  2.5]
  # Углу и угловой скорости отдано вчетверо больше ячеек, чем положению
  # тележки: шест падает за десятки шагов, а тележка доезжает до границы
  # за сотни, и разрешение по θ важнее.
  bins:  [3, 3, 8, 8]       # итого 3·3·8·8 = 576 состояний

algo:
  gamma: 0.99               # горизонт дисконтирования
  initial_q: 0.0            # нейтральная инициализация Q
  # α убывает по расписанию, а не фиксировано. Условие сходимости
  # Роббинса–Монро требует убывающего шага: при постоянном α таблица
  # колеблется вокруг решения с амплитудой ~α·|TD-ошибка|, и на задаче
  # управления это переворачивает argmax — жадная политика скачет между
  # хорошей и негодной (измерено, T-11 в docs/07_TROUBLESHOOTING.md).
  learning_rate:
    type: linear
    start: 0.20
    end: 0.01
    decay_steps: 120000     # 80% бюджета на спад шага обучения
  epsilon:
    type: linear
    start: 1.0
    end: 0.02
    decay_steps: 60000      # 40% бюджета на спад разведки

eval:
  every_steps: 10000
  episodes: 20
  deterministic: true       # оценивается жадная политика — та же, что уйдёт в ONNX
  success_threshold: 195.0  # успех = эпизод «решён» по классическому критерию CartPole-v0

success_criteria:
  # Награда эпизода численно равна числу прожитых шагов, максимум — MaxStep = 200.
  # Порог 195 — классическое определение «CartPole-v0 решён»
  # (средняя награда 195 из 200), взятое без изменений.
  metric: Eval/Mean Reward
  threshold: 195.0
  within_steps: 150000

export:
  onnx_path: unity/MLAgentsLab/Assets/Envs/E02_CartPoleUnity/Models/E02_CartPoleUnity_qlearning.onnx
  verify: true
