# E08_SoccerArena — MA-POCA с самоигрой.
#
# Урок: https://rl-cuber-unity-code.com/courses/3-2 (MA-POCA и Self-Play)
# Проект курса: /unity-projects/soccer
#
# Отличие от всех предыдущих конфигов лаборатории: обучается одна команда
# из двух, а соперником управляет замороженный снимок политики из пула
# (блок `selfplay`). Метрикой прогресса служит не награда, а доля побед
# и ELO: награда здесь измеряет силу относительно ТЕКУЩЕГО соперника,
# который меняется вместе с обучаемой политикой.

experiment:
  env_id: E08_SoccerArena
  algo: mapoca
  seeds: [0, 1, 2]
  total_steps: 400000
  notes: "Урок 3.2: MA-POCA, CTDE, Self-Play, ELO"

env:
  mode: build            # build | editor
  build_path: builds/E08_SoccerArena/E08_SoccerArena.exe
  # 4 арены × 2 игрока в команде = 8 агентов на каждое поведение.
  num_areas: 4
  time_scale: 20.0
  no_graphics: true
  env_parameters:
    difficulty: 1.0

network:
  # Актор — децентрализованный: вход 56 (лучи) + 8 (вектор) = 64.
  type: mlp
  hidden_sizes: [256, 256]
  activation: relu
  # Централизованный критик и контрфактический базлайн: внимание над
  # множеством игроков. embed_dim обязана делиться на num_heads.
  embed_dim: 64
  num_heads: 4
  attention_hidden: 128

algo:
  gamma: 0.99
  gae_lambda: 0.95
  # Затухающий шаг: без него политика продолжает блуждать после того,
  # как научилась забивать (docs/07_TROUBLESHOOTING.md, T-13).
  learning_rate:
    type: linear
    start: 0.0003
    end: 0.00005
    decay_steps: 400000
  clip_range: 0.2
  epochs: 3
  minibatch_size: 128
  rollout_steps: 256
  value_coef: 0.5
  baseline_coef: 0.5
  # Три ветки по три действия дают стартовую энтропию 3·ln3 ≈ 3.3 нат,
  # поэтому коэффициент меньше, чем у одноветочных сред.
  entropy_coef: 0.005
  max_grad_norm: 0.5
  normalize_advantage: true
  target_kl: 0.0
  # Разведка живёт в энтропии дискретной политики, а не в ε-жадности.
  # Ключ обязателен схемой конфигов; ноль означает «методом не используется».
  epsilon: 0.0

selfplay:
  # TeamId обучаемой команды и соперника. Наблюдение дано в командной
  # системе координат (ENV_SPEC.md §4), поэтому умение переносится
  # с одной стороны на другую и учить обе не нужно.
  learner_team: 0
  opponent_team: 1
  # Как часто менять соперника. Реже — политика переобучается под одного;
  # чаще — среда снова становится нестационарной.
  swap_every_steps: 5000
  # Как часто класть текущую политику в пул.
  save_every_steps: 10000
  # Размер окна пула: играть против версии тысячедавней давности так же
  # бесполезно, как против случайной.
  window: 10
  # Доля матчей против текущей политики. Ноль означает «бить только
  # устаревшие версии себя».
  play_against_latest_ratio: 0.5
  elo_k: 16.0

eval:
  every_steps: 20000
  # Матчей на одну оценку. Исход матча — величина с тремя значениями
  # (победа/ничья/поражение), и на десятке матчей доля побед шумит.
  episodes: 20
  deterministic: true

success_criteria:
  # Приёмка по доле побед, а не по награде: награда за матч зависит от силы
  # соперника, который меняется по ходу обучения (T-17). Порог 0.6 против
  # ПОСЛЕДНЕГО снимка означает «политика устойчиво обыгрывает свою недавнюю
  # версию», то есть продолжает расти.
  metric: Eval/Success Rate
  threshold: 0.6
  within_steps: 400000

export:
  # В ONNX уходит только актор: у игрока в Unity нет наблюдений партнёра,
  # и централизованный критик там взять неоткуда (CTDE, буква «D»).
  onnx_path: unity/MLAgentsLab/Assets/Envs/E08_SoccerArena/Models/E08_SoccerArena_mapoca.onnx
  verify: true
