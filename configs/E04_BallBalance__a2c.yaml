# A2C в среде E04_BallBalance — первый пример с непрерывными действиями (урок 2.3).
#
# Политика гауссова: сеть выдаёт среднее, разведка живёт в обучаемом σ.
# Действие приводится к диапазону Unity преобразованием clamp(x, -3, 3)/3 —
# тем же, что выполняет граф ONNX (docs/04_ONNX_CONTRACT.md, §4.2).
#
# Структура блоков — Приложение A инструкции проекта.

experiment:
  env_id: E04_BallBalance
  algo: a2c
  seeds: [0, 1, 2]
  total_steps: 100000       # шагов сбора; шаг = один env.step() по всем аренам
  notes: "Урок 2.3. Actor-Critic с гауссовой политикой; эталон для сравнения — PPO на той же среде."

env:
  mode: build
  build_path: builds/E04_BallBalance/E04_BallBalance.exe
  num_areas: 8              # 8 арен в сцене = 8 параллельных сред
  time_scale: 20.0          # выше ~20 ломается физика PhysX
  no_graphics: true
  env_parameters:
    difficulty: 1.0

network:
  # Архитектуру задаёт пользователь; алгоритм её не знает (требование 8.4).
  # В ноутбуке эта же сеть определяется прямо в ячейке и полностью редактируема.
  type: gaussian_mlp
  hidden_sizes: [128, 128]
  value_hidden_sizes: [128, 128]
  activation: tanh          # tanh, а не relu: гладкая политика лучше подходит для управления
  log_std_init: -0.3        # σ ≈ 0.74 в сырых единицах, то есть ≈ 0.25 после приведения к [-1, 1]

algo:
  gamma: 0.99
  gae_lambda: 0.95          # компромисс смещение/дисперсия в оценке преимущества
  # Шаг обучения затухает до нуля к концу бюджета — как и у штатного
  # тренера ML-Agents (learning_rate_schedule: linear). Причина не в
  # тонкой настройке: когда задача решена, награда среды становится
  # почти постоянной, преимущества вырождаются в шум критика, а их
  # нормировка возводит этот шум обратно в единичный масштаб —
  # и политика начинает случайно блуждать, разрушая уже выученное
  # (измерено, T-13 в docs/07_TROUBLESHOOTING.md).
  learning_rate:
    type: linear
    start: 0.0007
    end: 0.0
    decay_steps: 100000
  # Короткий роллаут — рабочий режим именно A2C, а не произвольная настройка.
  # A2C делает ОДИН градиентный шаг на роллаут, поэтому длина роллаута прямо
  # задаёт число обновлений: при 128 шагах их всего 780 на весь бюджет,
  # при 16 — 6250. PPO той же длиной роллаута не страдает: он проходит по нему
  # 4 эпохи мини-батчами и делает из одного роллаута 16 шагов вместо одного.
  # Измерено: с rollout_steps = 128 A2C за 20 000 шагов дошёл лишь до 10.4
  # при случайном уровне 7.1.
  rollout_steps: 16         # 16 шагов × 8 арен = 128 переходов на обновление
  value_coef: 0.5
  entropy_coef: 0.001       # не даёт политике схлопнуться раньше, чем она обучится
  max_grad_norm: 0.5
  # Нормировка преимуществ ВЫКЛЮЧЕНА — как и в эталонных реализациях A2C.
  # Батч A2C мал (128 переходов), поэтому среднее и разброс по нему сами
  # оценены грубо, а деление на такой разброс превращает шум критика
  # в полноразмерный градиент. Без нормировки величина шага пропорциональна
  # истинному преимуществу и сама сходит на нет, когда учиться уже нечему
  # (T-13 в docs/07_TROUBLESHOOTING.md). PPO с его батчем в 1024 перехода
  # и обрезкой отношения правдоподобий нормировку переносит спокойно.
  normalize_advantage: false
  # ε on-policy методом не используется: разведка — это σ политики.
  # Блок обязателен структурой конфига; тег Policy/Epsilon пишется нулём.
  epsilon:
    type: constant
    value: 0.0

eval:
  every_steps: 20000
  episodes: 20
  deterministic: true       # оценивается среднее политики — то же, что выдаёт ONNX
  success_threshold: 99.0   # успех = эпизод дожил до MaxStep (максимум ровно 100)

success_criteria:
  # Награда эпизода = 0.1 × число прожитых шагов, максимум 100 при MaxStep = 1000.
  # Порог 80 означает «в среднем шар удерживается 800 шагов из 1000», то есть
  # 16 секунд из 20 — устойчивое поведение, а не случайное везение.
  metric: Eval/Mean Reward
  threshold: 80.0
  within_steps: 100000

export:
  onnx_path: unity/MLAgentsLab/Assets/Envs/E04_BallBalance/Models/E04_BallBalance_a2c.onnx
  verify: true
